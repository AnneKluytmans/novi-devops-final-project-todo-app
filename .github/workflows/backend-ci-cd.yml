# backend workflow

name: backend CI/CD pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
    
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'frontend/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: todo-api

jobs:

  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 20, 22 ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js version ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: |
          echo "Installing project dependencies using npm ci..."
          npm ci

      - name: Run linter
        working-directory: ./backend
        run: |
          echo "Running ESLint to ensure code quality and consistent style..."
          npm run lint


  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 20, 22 ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js version ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: |
          echo "Installing project dependencies using npm ci..."
          npm ci

      - name: Run unit tests
        working-directory: ./backend
        run: |
          echo "Running unit tests in CI mode..."
          npm run test:unit


  dependency-scan:
    name: Dependency scan - npm audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js version 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: |
          echo "Installing project dependencies using npm ci..."
          npm ci

      - name: Run npm audit
        working-directory: ./backend
        run: |
          echo "Running npm audit to detect high or critical dependency vulnerabilities..."
          npm audit --omit=dev --audit-level=high || true

      - name: Save audit report
        working-directory: ./backend
        run: npm audit --json > npm-audit.json || true
      
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report-node-${{ matrix.node-version }}
          path: backend/npm-audit.json


  sast:
    name: SAST - CodeQL
    runs-on: ubuntu-latest

    permissions:
      security-events: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Announce CodeQL Analysis
        run: echo "Running static application security testing (SAST) with CodeQL..."
      
      - name: Run CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  
  integration-test:
    name: Integration Tests
    needs: [lint, unit-test, dependency-scan]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: |
          echo "Installing project dependencies using npm ci..."
          npm ci

      - name: Run integration tests
        run: |
          echo "Running integration tests with Docker Compose..."
          docker compose -f docker-compose.test.yml up --build --abort-on-container-exit
        env:
          POSTGRES_USER: ${{ secrets.TEST_DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
          POSTGRES_DB: ${{ secrets.TEST_DB_NAME }}
          NODE_ENV: test
      
      - name: Cleanup test containers
        run: docker compose -f docker-compose.test.yml down -v
  

  build-scan-push:
    name: Build, Scan and Push Docker Image
    runs-on: ubuntu-latest
    needs: [sast, integration-test]

    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        run: |
          IMAGE_OWNER=$(echo "${{ github.repository }}" | cut -d'/' -f1 | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=${{ env.REGISTRY }}/$IMAGE_OWNER/${{ env.IMAGE_NAME }}" >> $GITHUB_ENV

      - name: Get version
        run: |
          echo "Extracting backend version from package.json..."
          VERSION=$(node -p "require('./backend/package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            # immutable sha tag
            type=sha,format=long

            # branch tag
            type=ref,event=branch

            # version tags (only on main)
            type=raw,value=${{ env.VERSION }},enable=${{ github.ref == 'refs/heads/main' }}

            # latest only on main
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: ./backend 
          file: ./backend/Dockerfile 
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy container scan
        uses: aquasecurity/trivy-action@0.19.0
        continue-on-error: true
        with:
          image-ref: ${{ env.IMAGE }}:sha-${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          scanners: vuln
          exit-code: 1

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
          ref: ${{ github.ref }}
          sha: ${{ github.sha }}

      - name: Push image
        if: success()
        uses: docker/build-push-action@v5
        with:
          context: ./backend 
          file: ./backend/Dockerfile 
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
  
  deploy-staging:
    name: Deploy Backend to Staging
    runs-on: ubuntu-latest
    needs: [ build-scan-push ]
    if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'

    steps:
      - name: Trigger Backend Deploy to Staging
        run: |
          echo "🚀 Deploying backend to STAGING with Render..."
          curl -X POST "${{ secrets.RENDER_STAGING_DEPLOY_HOOK_BACKEND }}"
      
      - name: Wait for deployment to be live
        run: |
          echo "⏳ Waiting for deployment..."
          for i in {1..10}; do
            # Check algemene API health
            if curl -f https://todo-app-annekluytmans-api-staging.onrender.com/api/health; then
              echo "🏆 API Deployment successful!"
            else
              echo "🔄 API not ready yet... retrying in 10s"
              sleep 10
              continue
            fi

            # Check database health
            if curl -f https://todo-app-annekluytmans-api-staging.onrender.com/api/health/db; then
              echo "🏆 Database connection OK!"
              exit 0
            else
              echo "🔄 Database not ready yet... retrying in 10s"
              sleep 10
            fi
          done
          echo "❌ Deployment failed"
          exit 1

      - name: Notify deployment
        run: |
          echo "=========================================="
          echo "✅ DEPLOYMENT COMPLETE!!"
          echo "=========================================="
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "==========================================" 


  deploy-production:
    name: Deploy Backend to Production
    runs-on: ubuntu-latest
    needs: [ build-scan-push ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Trigger Backend Deploy to Production
        run: |
          echo "🚀 Deploying backend to PRODUCTION with Render..."
          curl -X POST "${{ secrets.RENDER_PROD_DEPLOY_HOOK_BACKEND }}"

      - name: Wait for deployment to be live
        run: |
          echo "⏳ Waiting for deployment..."
          for i in {1..10}; do
            # Check algemene API health
            if curl -f https://todo-app-annekluytmans-api-production.onrender.com/api/health; then
              echo "🏆 API Deployment successful!"
            else
              echo "🔄 API not ready yet... retrying in 10s"
              sleep 10
              continue
            fi

            # Check database health
            if curl -f https://todo-app-annekluytmans-api-production.onrender.com/api/health/db; then
              echo "🏆 Database connection OK!"
              exit 0
            else
              echo "🔄 Database not ready yet... retrying in 10s"
              sleep 10
            fi
          done
          echo "❌ Deployment failed"
          exit 1

      - name: Notify deployment
        run: |
          echo "=========================================="
          echo "✅ DEPLOYMENT COMPLETE!!"
          echo "=========================================="
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "==========================================" 
