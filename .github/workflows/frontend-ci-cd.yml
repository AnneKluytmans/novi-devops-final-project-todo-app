# frontend workflow

name: frontend CI/CD pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
    
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'backend/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:

  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 20, 22 ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js version ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json 

      - name: Install dependencies
        working-directory: ./frontend
        run: |
          echo "Installing project dependencies using npm ci..."
          npm ci

      - name: Run linter
        working-directory: ./frontend
        run: |
          echo "Running ESLint to ensure code quality and consistent style..."
          npm run lint

  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 20, 22 ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js version ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: |
          echo "Installing project dependencies using npm ci..."
          npm ci

      - name: Run unit tests
        working-directory: ./frontend
        run: |
          echo "Running unit tests in CI mode..."
          npm run test:ci
  

  dependency-scan:
    name: Dependency scan - npm audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js version '20'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: |
          echo "Installing project dependencies using npm ci..."
          npm ci

      - name: Run npm audit
        working-directory: ./frontend
        run: |
          echo "Running npm audit to detect high or critical dependency vulnerabilities..."
          npm audit --omit=dev --audit-level=high || true

      - name: Save audit report
        working-directory: ./frontend
        run: npm audit --json > npm-audit.json || true
      
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report-node-${{ matrix.node-version }}
          path: frontend/npm-audit.json
  

  sast:
    name: SAST - CodeQL
    runs-on: ubuntu-latest

    permissions:
      security-events: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Announce CodeQL Analysis
        run: echo "Running static application security testing (SAST) with CodeQL..."
      
      - name: Run CodeQL Analysis
        uses: github/codeql-action/analyze@v4
  

  build:
    name: Build and upload static artifact
    needs: [lint, unit-test, dependency-scan, sast]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js version '20'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: |
          echo "Installing project dependencies using npm ci..."
          npm ci

      - name: Build
        working-directory: ./frontend
        run: |
          echo "Building the frontend application..."
          npm run build
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist


  deploy-staging:
    name: Deploy Frontend to Staging
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
    
    steps:
      - name: Trigger Frontend Deploy to Staging 
        run: |
          echo "🚀 Deploying frontend to STAGING with Render..."
          curl -X POST "${{ secrets.RENDER_STAGING_DEPLOY_HOOK_FRONTEND }}"


  deploy-production:
    name: Deploy Frontend to Production
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' || github.event_name =='push'
    
    steps:
      - name: Trigger Frontend Deploy to Production
        run: |
          echo "🚀 Deploying frontend to PRODUCTION with Render..."
          curl -X POST "${{ secrets.RENDER_PROD_DEPLOY_HOOK_FRONTEND }}"